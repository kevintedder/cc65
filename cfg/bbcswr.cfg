FEATURES {
    STARTADDRESS: default = $8000;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0040; # 64 byte C stack
    __HIMEM__:     type = weak, value = $c000;
}
MEMORY {
    ZP1:	file = "", define = yes, start = $0070, size = $0030;	# 48 bytes ($70...$9F)
    ZP2:	file = "", define = yes, start = $00B0, size = $0010;	# 16 Bytes ($B0...$BF)
    MAIN:	file = %O, define = yes, start = $8000, size = $4000;	# 16384 Bytes ($8000...$BFFF)
    AWS:	file = "", define = yes, start = $0E00, size = $0100;	# 256 Bytes ($0E00...$0EFF)
}
SEGMENTS {
    ZEROPAGE:	load = ZP1,		type = zp;
    ZEROPAGE2:	load = ZP2,		type = zp;
    STARTUP:	load = MAIN,	type = ro;
    LOWCODE:	load = MAIN,	type = ro,	optional = yes;
    ONCE:		load = MAIN,	type = ro,	optional = yes;
    CODE:		load = MAIN,	type = ro;
    RODATA:		load = MAIN,	type = ro;
    DATA:		load = AWS,		type = rw,	define = yes;
    BSS:		load = AWS,		type = bss,	define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
